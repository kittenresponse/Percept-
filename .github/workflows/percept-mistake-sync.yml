name: Percept Mistake Auto Archive
on:
  issues:
    types: [opened, labeled, edited, reopened]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  archive:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'percept-mistake')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Archive issue as immutable incident snapshot
        env:
          EVENT_PATH: ${{ github.event_path }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 governance/learning/record_issue.py
      - name: Sync archive to GitHub
        run: |
          git config user.name "percept-learning-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/learning/incidents/
          if ! git diff --cached --quiet; then
            git commit -m "learning: sync incident issue #${{ github.event.issue.number }}"
            git push
          fi
