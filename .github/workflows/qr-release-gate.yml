name: QR release gate tests
on:
  push:
    paths:
      - 'qr_verification/tools/**'
      - '.github/workflows/qr-release-gate.yml'
  pull_request:
    paths:
      - 'qr_verification/tools/**'
      - '.github/workflows/qr-release-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned QR dependencies
        run: python -m pip install 'PyMuPDF==1.26.5' 'opencv-python-headless==4.11.0.86' 'numpy==2.2.6'
      - name: Compile both gates
        run: python -m py_compile qr_verification/tools/check_release_registry.py qr_verification/tools/check_final_pdf.py
      - name: Run fail-closed unit tests
        run: python -m unittest discover -s qr_verification/tools -p 'test_*.py' -v
