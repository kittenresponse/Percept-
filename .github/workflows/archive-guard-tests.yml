name: Percept Google Drive Archive Guard
on:
  push:
    paths:
      - 'archive_guard/**'
      - 'tests/test_drive_archive.py'
      - '.github/workflows/archive-guard-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated archive guard verification
        run: python -m unittest discover -s tests -p 'test_drive_archive.py' -v
